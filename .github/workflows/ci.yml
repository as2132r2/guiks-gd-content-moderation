name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Build container
        run: docker build --tag guiks-gd-content-moderation:ci .
      - name: Smoke-test container readiness
        run: |
          docker run --detach --name moderation-ci --publish 3300:3300 guiks-gd-content-moderation:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3300/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs moderation-ci
          exit 1
      - name: Clean up test container
        if: always()
        run: docker rm --force moderation-ci || true
