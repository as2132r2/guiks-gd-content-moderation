# 贵客松广电内容项目 —— 独立演示 stack。
#
# ⚠️ 这是一套【独立】的 compose：自己的 compose 文件、自己的容器、
#    自己的端口(3300)。它和主应用 bohe-console 没有任何耦合 ——
#    不共用容器、不共用端口、不共用数据库，绝不塞进 bohe-console 的 compose。
#
# 从 guiks-gd-content-moderation/ 目录启动：
#   docker compose -f docker-compose.yml up -d --build
# 打开 http://localhost:3300

services:
  app:
    build: .
    container_name: guiks-gd-content-moderation
    ports:
      - "3300:3300"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # demo 可零配置跑；production 必须按 README 配置身份、机器凭据和上游。
      PORT: 3300
      APP_MODE: ${APP_MODE:-demo}
      DATABASE_PATH: /app/data/app.db
      FAIL_CLOSED: ${FAIL_CLOSED:-true}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-gatekeeper-demo}
      # 留空时 demo=true、production=false；也可在 .env 中显式覆盖。
      ALLOW_MOCK_UPSTREAM: ${ALLOW_MOCK_UPSTREAM:-}
      # 控制台里显示的「接管目标」标签（受控靶子）。
      TARGET_LABEL: ${TARGET_LABEL:-县级融媒体中心（演示环境）}
      # 留空 = 用内置 mock 上游；填真实 base_url 才会去代理真实上游。
      UPSTREAM_URL: ${UPSTREAM_URL:-}
      UPSTREAM_KEY: ${UPSTREAM_KEY:-}
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:-GLM-5.2}
      # demo 内存里保留多少条审计流量。
      MAX_AUDITS: ${MAX_AUDITS:-500}
    volumes:
      - moderation-data:/app/data
    healthcheck:
      # /readyz 同时检查服务、SQLite 和模型配置是否就绪。
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3300/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  moderation-data:
